[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200
board_build.filesystem = littlefs
board_build.partitions = partitions.csv
build_flags =
    -DDEBUG_ENABLED=0
    -DCORE_DEBUG_LEVEL=0          ; strip Arduino-core ESP_LOGx strings
    -Os
    -ffunction-sections          ; place each function in its own section so
    -fdata-sections              ; the linker can garbage-collect unused ones
    -Wl,--gc-sections
lib_deps =
    bblanchon/ArduinoJson
    knolleary/PubSubClient  ; MQTT
    marcoschwartz/LiquidCrystal_I2C

[env:native]
platform = native
test_framework = unity
build_src_filter = -<*>
build_flags = -I test/stubs -I src -D DEBUG_ENABLED=0
lib_deps = bblanchon/ArduinoJson
test_filter = test_*
targets = test